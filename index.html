<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Таймер</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:#000;overflow:hidden}
body{font-family:Arial,sans-serif;color:#fff;display:flex;align-items:center;justify-content:center}
#start{padding:16px 30px;font-size:22px;cursor:pointer;border:0;border-radius:10px}
#timer{text-align:center;display:none}
#count{font-size:96px;font-weight:bold}
#scare{display:none;position:fixed;inset:0;width:100%;height:100%;object-fit:cover;background:#000;z-index:10}
#flash{display:none;position:fixed;inset:0;background:#fff;z-index:20;animation:f .08s linear 2;pointer-events:none}
@keyframes f{50%{opacity:0}}
</style>
</head>
<body>
<button id="start">НАЖМИТЕ, ЧТОБЫ НАЧАТЬ</button>
<div id="timer"><div id="count">5</div><div>Подождите...</div></div>
<img id="scare" src="screamer.png" alt="">
<div id="flash"></div>
<audio id="sound" src="scream.mp3" preload="auto" loop></audio>

<script>
const start=document.getElementById('start');
const timer=document.getElementById('timer');
const count=document.getElementById('count');
const scare=document.getElementById('scare');
const flash=document.getElementById('flash');
const sound=document.getElementById('sound');

start.onclick=async()=>{
  start.style.display='none';
  timer.style.display='block';

  try{await document.documentElement.requestFullscreen()}catch(e){}

  let n=5;
  count.textContent=n;

  const x=setInterval(()=>{
    n--;
    if(n>0){
      count.textContent=n;
    }else{
      clearInterval(x);
      timer.style.display='none';

      // Скример остаётся на экране постоянно.
      scare.style.display='block';

      // Короткая вспышка только в момент появления.
      flash.style.display='block';

      // Музыка запускается и автоматически повторяется по кругу.
      sound.currentTime=0;
      sound.play().catch(()=>{});
    }
  },1000);
};
</script>
</body>
</html>
